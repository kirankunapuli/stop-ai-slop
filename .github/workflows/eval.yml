name: eval

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Score the skill against the fixtures
        env:
          EVAL_PROVIDER: openai
          EVAL_MODEL: gpt-6-luna
          EVAL_MODE: strict
          EVAL_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$EVAL_API_KEY" ]; then
            echo "No OPENAI_API_KEY. Skipping the eval."
            exit 0
          fi
          node evals/run.mjs
